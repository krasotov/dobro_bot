server {
    listen 80;
    server_name bot.xn--80agc6alen.xn--p1ai bot.адмспго.рф;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bot.xn--80agc6alen.xn--p1ai bot.адмспго.рф;

    ssl_certificate /etc/letsencrypt/live/bot.xn--80agc6alen.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.xn--80agc6alen.xn--p1ai/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
