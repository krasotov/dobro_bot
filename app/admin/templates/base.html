<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доброчат — админ</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1a1a1a; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    nav { background: #1e3a5f; color: #fff; padding: 14px 24px; }
    nav a { color: #fff; margin-right: 16px; text-decoration: none; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 10px; text-align: left; font-size: 14px; }
    .btn { display: inline-block; background: #1e3a5f; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; border: 0; cursor: pointer; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .stat { background: #eef3f9; border-radius: 8px; padding: 16px; }
    .stat strong { display: block; font-size: 28px; }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
