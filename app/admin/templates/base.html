<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доброчат — админ</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1a1a1a; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px; }
    nav { background: #1e3a5f; color: #fff; padding: 14px 24px; overflow: hidden; }
    nav a { color: #fff; margin-right: 16px; text-decoration: none; }
    nav span { white-space: nowrap; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    table.data-table { min-width: 1100px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 10px 8px; text-align: left; font-size: 13px; vertical-align: top; }
    th { white-space: nowrap; background: #f9fafb; font-weight: 600; position: sticky; top: 0; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    td.nowrap { white-space: nowrap; }
    td.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .user-item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; background: #fafbfc; }
    .user-item-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .user-item-head strong { font-size: 17px; }
    .user-meta { color: #4b5563; font-size: 13px; }
    .user-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px; font-size: 14px; margin-bottom: 10px; }
    .user-grid dt { color: #6b7280; font-size: 12px; margin: 0 0 2px; }
    .user-grid dd { margin: 0 0 8px; word-break: break-word; }
    .user-address { font-size: 14px; line-height: 1.45; margin-bottom: 12px; word-break: break-word; }
    .user-address-label { color: #6b7280; font-size: 12px; margin-bottom: 4px; }
    .badge { display: inline-block; background: #e0e7ef; color: #1e3a5f; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .btn { display: inline-block; background: #1e3a5f; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; border: 0; cursor: pointer; font-size: 14px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .stat { background: #eef3f9; border-radius: 8px; padding: 16px; }
    .stat strong { display: block; font-size: 28px; }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
