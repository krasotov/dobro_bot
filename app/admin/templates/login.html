{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:80px auto;">
  <h1>Вход в админ-панель</h1>
  {% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
  <form method="post">
    <p><label>Логин<br><input name="username" required style="width:100%;padding:8px"></label></p>
    <p><label>Пароль<br><input name="password" type="password" required style="width:100%;padding:8px"></label></p>
    <button class="btn" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
